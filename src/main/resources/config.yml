# WerewolfUtils 設定ファイル
#
# overrides セクションは GUI(/wwconfig)が自動管理するため手動編集不要です。

# ゲーム中(#game_state ww_state が 1 以上)の機能ブロック/額縁の操作を許可するか
#   true  = 操作を許可する
#   false = 操作を禁止する(ゲーム中のみ)
# 対象: 樽 / チェスト / トラップチェスト / エンダーチェスト / シュルカーボックス /
#       かまど / 溶鉱炉 / 燻製器 / 作業台 / 金床 / エンチャント台 / 醸造台 /
#       砥石 / 製図台 / 鍛冶台 / 石切台 / 機織り機 / ホッパー / ディスペンサー /
#       ドロッパー / 額縁 / 光る額縁 など
# ゲーム外では常に操作できます。
# werewolfutils.bypass.interact 権限を持つプレイヤーは制限を受けません。
allow-interaction: false
