name: WerewolfUtils
version: '1.0'
main: com.werewolf.utils.WerewolfUtilsPlugin
api-version: '1.21'
description: GUI and totem utilities for WerewolfQuest datapack
commands:
  wwconfig:
    description: WerewolfQuestのゲーム設定GUIを開きます
    usage: /wwconfig
    permission: werewolfutils.config
  wwstart:
    description: WerewolfQuestのゲームを開始します
    usage: /wwstart
    permission: werewolfutils.game
  wwend:
    description: WerewolfQuestのゲームを終了します
    usage: /wwend
    permission: werewolfutils.game
permissions:
  werewolfutils.config:
    description: ゲーム設定GUIを開く権限
    default: op
  werewolfutils.game:
    description: ゲームの開始/終了コマンドを使う権限
    default: op
